# ALiLinux SDK — the single place for configuration. Variables can be overridden from the environment.
SDK_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

# --- directories -------------------------------------------------------------
DL_DIR="${DL_DIR:-$SDK_ROOT/dl}"            # cache of downloaded sources (sums in scripts/checksums.sha256)
# Board: boards/<name>/ holds what is specific to one board (kernel board patches, board.conf, rootfs overlay).
BOARD="${BOARD:-ferguson-ariva54}"
BOARD_DIR="$SDK_ROOT/boards/$BOARD"
[ -f "$BOARD_DIR/board.conf" ] || { echo "sdk.conf: unknown board '$BOARD' (see boards/)" >&2; return 1 2>/dev/null || exit 1; }
. "$BOARD_DIR/board.conf"                   # BOARD_DEFCONFIG, MAINCODE_*
OUT_DIR="${OUT_DIR:-$SDK_ROOT/out/$BOARD}"   # per-board work outputs: rootfs/, kernel/, maincode.abs
DIST_DIR="${DIST_DIR:-$SDK_ROOT/dist/$BOARD}"  # final deliverables (scripts/95-dist.sh): kernel, maincode.abs, full image
TOOLCHAIN_DIR="${TOOLCHAIN_DIR:-$SDK_ROOT/out/toolchain}"   # musl toolchain, shared by all boards
BUILD_DIR="${BUILD_DIR:-/dev/shm/alisdk}"   # work trees; tmpfs (kernel ~2.5 GB, toolchain more: set to /mnt/...)
JOBS="${JOBS:-$(nproc)}"

# --- versions (URLs and sums: scripts/00-fetch.sh, scripts/checksums.sha256) ----
CIP_VER="4.4.302-cip115"
BUSYBOX_VER="1.38.0"
BEARSSL_VER="0.6"                          # cryptography (networkd: WPA2; TLS without certificate verification)
FIRMWARE_TAG="20261019"                      # linux-firmware: rt2870.bin (RT5370, rt2800usb)
MCM_COMMIT="5e8042e63de29f8473fc3b0b831a587ba284e1a8"   # musl-cross-make

# --- image -------------------------------------------------------------------
# Root password (UART and telnet).  Empty (the default): root logs in without a password.  Set it to get a SHA-512 hash in
# /etc/shadow (fixed salt = reproducible build).
ROOT_PASSWORD="${ROOT_PASSWORD:-}"

# --- toolchains -------------------------------------------------------------
# Userland: musl, soft-float, static-PIE.  By default scripts/10-toolchain.sh builds it (musl-cross-make, recipe in
# toolchain/) into $TOOLCHAIN_DIR; set MUSL_TC to the directory of an existing one (prefix mipsel-linux-musl-)
# to skip the build.
MUSL_TC="${MUSL_TC:-$TOOLCHAIN_DIR}"
MUSL_PREFIX="mipsel-linux-musl-"
# Kernel: distro cross GCC (Debian package gcc-mipsel-linux-gnu); code correctness is guarded by scripts/verify-isa.sh.
KCROSS="${KCROSS:-mipsel-linux-gnu-}"
KFLAGS="-fno-pie"                           # target code; NOT -fcommon: it overrides the kernel's -fno-common and makes SCOMMON
                                            # symbols in modules, which the module loader cannot relocate
HOSTFLAGS_EXTRA="-fcommon"                  # GCC >= 10 + the 4.4 host tools (dtc/kconfig define globals more than once)

# --- GLOBAL FLAGS (always injected, also with prebuilt toolchains) ---
SDK_ARCH="-march=mips32 -mtune=4kc -msoft-float -mno-mips16"   # 4Kc: MIPS32 R1, no FPU, no MIPS16
SDK_PAGE=4096                                # NOT 64 kB (binutils default max-page-size for MIPS)
SDK_CFLAGS="$SDK_ARCH -fPIE -Os"
SDK_LDFLAGS="-static-pie -Wl,--no-dynamic-linker -Wl,-z,max-page-size=$SDK_PAGE -Wl,-z,common-page-size=$SDK_PAGE"
