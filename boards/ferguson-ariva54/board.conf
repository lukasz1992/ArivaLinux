# Board: Ferguson Ariva 54 (ALi C3503D, 64 MiB RAM, 8 MiB SPI NOR, FD650K front panel, RCU540 remote)
BOARD_DEFCONFIG="ali_ariva54_defconfig"     # arch/mips/configs/ (added by this board's patches)
BOARD_HOSTNAME="ariva54"                    # written to /etc/hostname when the rootfs is built

# Layout of the maincode chunk in the box's flash (chunk header fields; the loader needs span to match its chain):
# the chunk lives at 0x130000 and owns MAINCODE_SPAN bytes up to the next chunk (osd_string at 0x58D400).
MAINCODE_SPAN=0x46C200
MAINCODE_NAME="maincode"
MAINCODE_VERSION="ALiLinux"
MAINCODE_TIME="2019-9-26"
